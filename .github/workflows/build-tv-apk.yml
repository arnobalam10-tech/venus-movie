name: Build Venus TV APK

on:
  push:
    branches: [master]
    paths:
      - "android-tv/**"
      - ".github/workflows/build-tv-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon

      - name: Copy APK into website
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk public/venus-tv.apk

      - name: Commit APK back to the repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build: update venus-tv.apk [skip ci]"
          file_pattern: public/venus-tv.apk
